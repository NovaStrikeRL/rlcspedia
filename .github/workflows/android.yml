name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # El runner ubuntu-latest ya incluye el Android SDK ($ANDROID_HOME).
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Compilar APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Nombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk "RLCSpedia-${GITHUB_REF_NAME//\//-}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: RLCSpedia-apk
          path: RLCSpedia-*.apk

      - name: Publicar Release (si la versión es nueva)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if gh release view "v$v" > /dev/null 2>&1; then
            echo "La Release v$v ya existe; solo se sube el artefacto."
            exit 0
          fi
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          cp RLCSpedia-*.apk "RLCSpedia-v$v.apk"
          gh release create "v$v" "RLCSpedia-v$v.apk" --target "$GITHUB_SHA" --title "RLCSpedia v$v" --notes-file notes.md
