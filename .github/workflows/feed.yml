name: Datos de Liquipedia

on:
  schedule:
    - cron: "*/10 * * * *"   # cada 10 min (GitHub puede retrasarlo unos minutos)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  feed:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Consultar LiquipediaDB
        env:
          LIQUIPEDIA_API_KEY: ${{ secrets.LIQUIPEDIA_API_KEY }}
        run: python3 scripts/feed.py feed.json

      - name: Publicar en la rama data
        run: |
          [ -f feed.json ] || { echo "Sin feed (falta la clave)"; exit 0; }
          mkdir -p /tmp/data && cp feed.json /tmp/data/
          cat > /tmp/data/README.md <<'MD'
          Feed generado automáticamente por `.github/workflows/feed.yml`.
          Datos de [Liquipedia](https://liquipedia.net/rocketleague), licencia CC-BY-SA 3.0.
          MD
          cd /tmp/data
          git init -q -b data
          git config user.name "rlcspedia-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "feed $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
